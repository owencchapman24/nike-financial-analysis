[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "nike-financial-analysis"
version = "0.5.0"
description = "Reproducible Nike financial analysis using primary SEC filing data"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "matplotlib>=3.10,<4",
    "pandas>=2.3,<4",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=7,<8",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "pytest>=8.4,<10",
]

[project.scripts]
nike-sec-filings = "nike_financial_analysis.extract:main"
nike-historical-data = "nike_financial_analysis.pipeline:main"
nike-historical-analysis = "nike_financial_analysis.analysis:main"
nike-execute-notebook = "nike_financial_analysis.notebook_runner:main"
nike-scenario-forecast = "nike_financial_analysis.forecast:main"
nike-dcf-valuation = "nike_financial_analysis.valuation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
