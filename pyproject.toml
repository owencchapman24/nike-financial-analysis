[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "nike-financial-analysis"
version = "0.1.0"
description = "Reproducible Nike financial analysis using primary SEC filing data"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[project.scripts]
nike-sec-filings = "nike_financial_analysis.extract:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
